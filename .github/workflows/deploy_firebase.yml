name: Deploy to Firebase Hosting

# ソースコード（src/, index.html, package.json 等）が変更された時に
# 自動的にビルドして Firebase Hosting にデプロイする。
# ※ カメラ画像の追加 (public/cams/) だけでは発火しない。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'firebase.json'
      - 'scripts/generate_weather_cache.mjs'
  workflow_dispatch:  # 手動実行にも対応

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        # 🔒 セキュリティ保護:
        # クレジット/課金設定を紐付けた Gemini API キーが公開用 JS バンドルへ露出するのを防ぐため、
        # 本番ビルドへの VITE_GEMINI_API_KEY 埋め込みは無効化しています。
        # 公開サイトで一時的に実行する場合は管理画面の「一時APIキー設定 (sessionStorage)」を使用してください。
        # （※無料枠専用の別プロジェクトキーをあえて埋め込む場合のみ以下を有効化）
        # env:
        #   VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting
        run: npx -p firebase-tools firebase deploy --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
