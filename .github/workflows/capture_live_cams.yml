name: Capture Rishiri Live Cameras

on:
  workflow_dispatch: # Cloudflare等の外部APIキックおよびGitHub画面からの手動実行に対応
  repository_dispatch: # 外部APIからのリポジトリディスパッチトリガーにも対応

permissions:
  contents: write

# 同時実行・二重起動による git push 衝突を完全防止
concurrency:
  group: capture-live-cams
  cancel-in-progress: false

jobs:
  capture_cams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up FFmpeg (安定版 BtbN/FFmpeg-Builds 導入)
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run live camera capture script
        run: |
          python scripts/capture_live_cams.py --debug || true
          echo "=== 撮影結果一覧 ==="
          ls -lh public/cams/2026-*/* || true

      - name: Commit and push recorded screenshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cams/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git pull --rebase origin main || true
            git commit -m "🤖 [Auto-Capture] 利尻山ライブカメラ スクショ記録 ($(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST'))"
            git push
          fi
