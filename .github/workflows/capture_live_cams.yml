name: Capture Rishiri Live Cameras

on:
  workflow_dispatch: # Cloudflare等の外部APIキックおよびGitHub画面からの手動実行に対応
  repository_dispatch: # 外部APIからのリポジトリディスパッチトリガーにも対応

permissions:
  contents: write

# 同時実行・二重起動による git push 衝突を完全防止
concurrency:
  group: capture-live-cams
  cancel-in-progress: false

jobs:
  capture_cams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up FFmpeg (安定版 BtbN/FFmpeg-Builds 導入)
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install yt-dlp and streamlink
        run: pip install -U yt-dlp streamlink

      - name: Run live camera capture script
        run: |
          python scripts/capture_live_cams.py --debug || true
          echo "=== 撮影結果一覧 ==="
          ls -lh public/cams/2026-*/* || true

      - name: Commit and push recorded screenshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cams/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 [Auto-Capture] 利尻山ライブカメラ スクショ記録 ($(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST'))"
            for i in {1..3}; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed changes."
                exit 0
              fi
              echo "Push failed (transient network/502 error or conflict), retrying in 5s... ($i/3)"
              sleep 5
            done
            echo "Failed to push after 3 retries."
            exit 1
          fi

      - name: Send Heartbeat to Healthchecks.io
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is not set, skipping heartbeat."
            exit 0
          fi
          # ジョブが成功したか失敗したかに応じて、PingのURLを変更します（失敗時は即座にアラートを飛ばすため /fail を付与）
          STATUS_SUFFIX=""
          if [ "${{ job.status }}" != "success" ]; then
            STATUS_SUFFIX="/fail"
          fi
          curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL$STATUS_SUFFIX" || true
