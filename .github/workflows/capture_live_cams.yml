name: Capture Rishiri Live Cameras

on:
  schedule:
    # 毎時05分（GitHubの00分混雑ピークを回避し、遅延なく確実に撮影する推奨時間）
    - cron: '5 * * * *'
  workflow_dispatch: # GitHub Actions画面からの手動実行にも対応

permissions:
  contents: write

jobs:
  capture_cams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up FFmpeg (安定版 BtbN/FFmpeg-Builds 導入)
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run live camera capture script
        run: |
          python scripts/capture_live_cams.py --debug || true
          echo "=== 撮影結果一覧 ==="
          ls -lh public/cams/2026-*/* || true

      - name: Commit and push recorded screenshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cams/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git pull --rebase origin main || true
            git commit -m "🤖 [Auto-Capture] 利尻山ライブカメラ スクショ記録 ($(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST'))"
            git push
          fi
