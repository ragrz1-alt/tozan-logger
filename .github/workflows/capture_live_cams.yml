name: Capture Rishiri Live Cameras

on:
  workflow_dispatch: # Cloudflare等の外部APIキックおよびGitHub画面からの手動実行に対応
  repository_dispatch: # 外部APIからのリポジトリディスパッチトリガーにも対応
  schedule:
    - cron: '0 * * * *' # 毎時0分に実行（季節別日照スケジュール外はスクリプト内で高速スキップ）
permissions:
  contents: write

# 同時実行・二重起動による git push 衝突を完全防止
concurrency:
  group: capture-live-cams
  cancel-in-progress: false

jobs:
  capture_cams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (Playwright iframe Canvas抽出用)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (yt-dlp, streamlink, Pillow, Playwright Chrome)
        run: |
          pip install -U yt-dlp streamlink Pillow
          npm ci --prefer-offline --no-audit || npm install --no-audit
          npx playwright install --with-deps chrome

      - name: Run live camera capture script (6 cameras + seasonal solar guard)
        run: |
          python scripts/capture_live_cams.py --debug || true
          TODAY_JST=$(TZ='Asia/Tokyo' date +'%Y-%m-%d')
          mkdir -p /tmp/cams_backup_today
          cp -f "public/cams/$TODAY_JST/"*.jpg /tmp/cams_backup_today/ 2>/dev/null || true
          echo "=== 本日 ($TODAY_JST) の撮影結果一覧 ==="
          ls -lh "public/cams/$TODAY_JST/"* 2>/dev/null || echo "夜間スキップまたは新規撮影なし"

      - name: Commit and push recorded screenshots (Conflict-Free Self-Healing)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/cams/
          if git diff --staged --quiet; then
            echo "No changes to commit (Nighttime solar skip or no new files)."
            exit 0
          fi

          STAMP=$(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST')
          TODAY_JST=$(TZ='Asia/Tokyo' date +'%Y-%m-%d')
          git commit -m "🤖 [Auto-Capture] 利尻山ライブカメラ 6地点スクショ記録 ($STAMP)"

          for i in {1..4}; do
            if git pull --rebase origin main && git push origin main; then
              echo "Successfully pushed changes."
              exit 0
            fi
            echo "Rebase or push conflict detected, self-healing history.json... ($i/4)"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "public/cams/$TODAY_JST"
            cp -f /tmp/cams_backup_today/*.jpg "public/cams/$TODAY_JST/" 2>/dev/null || true
            python scripts/capture_live_cams.py --sync-only
            git add public/cams/
            if ! git diff --staged --quiet; then
              git commit -m "🤖 [Auto-Capture] 利尻山ライブカメラ 6地点スクショ記録 ($STAMP)"
            fi
            if git push origin main; then
              echo "Successfully pushed after self-healing merge."
              exit 0
            fi
            sleep 4
          done
          echo "Failed to push after 4 retries."
          exit 1

      - name: Send Heartbeat to Healthchecks.io
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is not set, skipping heartbeat."
            exit 0
          fi
          STATUS_SUFFIX=""
          if [ "${{ job.status }}" != "success" ]; then
            STATUS_SUFFIX="/fail"
          fi
          curl -fsS -m 10 --retry 5 -o /dev/null "$HEALTHCHECK_URL$STATUS_SUFFIX" || true
